# dsh-skill-manager bundle patch: inserts the plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) over dsh-base; activate with
# `dsh plugin --profile web add link:<path-to-this-package>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (settings namespace + skills-active/ file sync), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/dsh-skill-manager/client.js) load in
# the web GUI (settings.section "技能管理").
- insert:
    - id: skill-manager
      name: 'dsh-skill-manager'
